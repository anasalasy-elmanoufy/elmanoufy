<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة المنوفي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --bg2: #0f1525;
  --text: #f0f4ff;
  --muted: rgba(255,255,255,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-blobs {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
}
.blob {
  position: absolute; border-radius: 50%;
  filter: blur(80px); opacity: 0.18;
  animation: blobFloat 12s ease-in-out infinite alternate;
}
.blob1 { width:500px;height:500px;background:#ff6b6b;top:-100px;right:-100px;animation-delay:0s; }
.blob2 { width:400px;height:400px;background:#4ecdc4;bottom:-80px;left:-80px;animation-delay:3s; }
.blob3 { width:350px;height:350px;background:#a855f7;top:40%;right:30%;animation-delay:6s; }
.blob4 { width:300px;height:300px;background:#f59e0b;bottom:20%;right:10%;animation-delay:2s; }
@keyframes blobFloat {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(30px,20px) scale(1.1); }
}

.container {
  position: relative; z-index: 1;
  max-width: 960px; margin: 0 auto; padding: 40px 20px 80px;
}

.header { text-align:center; margin-bottom:45px; animation:fadeDown .7s ease; }
.header .badge {
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:50px; padding:6px 18px;
  font-size:13px; color:rgba(255,255,255,0.6);
  margin-bottom:18px; letter-spacing:1px;
}
.header h1 {
  font-size:clamp(34px,7vw,62px); font-weight:900; line-height:1.1;
  background:linear-gradient(135deg,#fff 0%,#f59e0b 45%,#ff6b6b 85%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:10px;
}
.header .subtitle {
  color:var(--muted); font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.header .subtitle::before, .header .subtitle::after {
  content:''; display:inline-block; width:40px; height:1px;
  background:linear-gradient(to left,transparent,rgba(255,255,255,0.2));
}
.header .subtitle::after {
  background:linear-gradient(to right,transparent,rgba(255,255,255,0.2));
}

/* LOGO */
.logo-wrap {
  display:flex; align-items:center; justify-content:center;
  margin-bottom:22px; gap:18px;
}
.logo-svg {
  width:80px; height:80px; flex-shrink:0;
  filter: drop-shadow(0 0 18px rgba(245,158,11,0.5));
  animation: logoSpin 6s ease-in-out infinite alternate;
}
@keyframes logoSpin {
  0%   { filter: drop-shadow(0 0 14px rgba(245,158,11,0.4)); transform: rotate(-3deg) scale(1); }
  100% { filter: drop-shadow(0 0 28px rgba(255,107,107,0.6)); transform: rotate(3deg) scale(1.05); }
}

/* BREADCRUMB */
.breadcrumb {
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  margin-bottom:28px; font-size:13px; color:var(--muted);
  animation:fadeIn .4s ease;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px; padding:10px 16px;
}
.breadcrumb .crumb { cursor:pointer;transition:color .2s;display:flex;align-items:center;gap:5px; }
.breadcrumb .crumb:hover { color:#f59e0b; }
.breadcrumb .sep { color:rgba(255,255,255,0.15); }
.breadcrumb .crumb.active { color:#f59e0b;font-weight:700;cursor:default; }

/* SECTION TITLE */
.section-title {
  font-size:17px;font-weight:700;color:rgba(255,255,255,0.6);
  margin-bottom:22px;display:flex;align-items:center;gap:10px;
  animation:fadeIn .4s ease;
}
.section-title::after {
  content:'';flex:1;height:1px;
  background:linear-gradient(to left,transparent,rgba(255,255,255,0.08));
}

/* CARDS */
.cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
.cards-grid.two-col { grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); }

.card {
  position:relative;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px; padding:28px 20px 22px;
  cursor:pointer; overflow:hidden; text-align:center;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s;
  animation:fadeUp .45s ease both;
}
.card::before {
  content:'';position:absolute;inset:0;
  background:var(--glow,rgba(255,255,255,0.03));
  opacity:0;transition:opacity .3s;
}
.card:hover { transform:translateY(-7px) scale(1.02); border-color:var(--c,rgba(255,255,255,0.2)); box-shadow:0 20px 50px rgba(0,0,0,0.4),0 0 30px var(--shadow,rgba(255,255,255,0.05)); }
.card:hover::before { opacity:1; }
.card .card-icon { font-size:44px;margin-bottom:14px;display:block;transition:transform .3s; }
.card:hover .card-icon { transform:scale(1.2) rotate(-8deg); }
.card h3 { font-size:17px;font-weight:700;color:#fff;margin-bottom:6px; }
.card p  { font-size:12px;color:var(--muted);line-height:1.6; }
.card .chip {
  display:inline-block;margin-top:14px;padding:4px 14px;
  border-radius:50px;font-size:11px;font-weight:700;
  background:var(--chip-bg,rgba(255,255,255,0.07));
  color:var(--chip-c,rgba(255,255,255,0.5));
  border:1px solid var(--chip-border,rgba(255,255,255,0.1));
  transition:all .3s;
}
.card:hover .chip { background:var(--c-alpha,rgba(255,255,255,0.1)); color:var(--c,#fff); border-color:var(--c,rgba(255,255,255,0.3)); }

/* colors */
.c-red   {--c:#ff6b6b;--c-alpha:rgba(255,107,107,.15);--shadow:rgba(255,107,107,.15);--glow:rgba(255,107,107,.06)}
.c-orange{--c:#f59e0b;--c-alpha:rgba(245,158,11,.15); --shadow:rgba(245,158,11,.15); --glow:rgba(245,158,11,.06)}

.c-sky   {--c:#38bdf8;--c-alpha:rgba(56,189,248,.15); --shadow:rgba(56,189,248,.15); --glow:rgba(56,189,248,.06)}
.c-lime  {--c:#a3e635;--c-alpha:rgba(163,230,53,.15); --shadow:rgba(163,230,53,.15); --glow:rgba(163,230,53,.06)}
.c-rose  {--c:#fb7185;--c-alpha:rgba(251,113,133,.15);--shadow:rgba(251,113,133,.15);--glow:rgba(251,113,133,.06)}

.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}
.d4{animation-delay:.16s}.d5{animation-delay:.20s}.d6{animation-delay:.24s}
.d7{animation-delay:.28s}.d8{animation-delay:.32s}.d9{animation-delay:.36s}
.d10{animation-delay:.40s}.d11{animation-delay:.44s}

/* FILES */
.files-list { display:flex;flex-direction:column;gap:12px;animation:fadeUp .5s ease; }
.file-item {
  display:flex;align-items:center;gap:15px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:16px 20px;
  text-decoration:none; color:var(--text); transition:all .25s; cursor:pointer;
}
.file-item:hover { border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.05);transform:translateX(-4px); }
.file-item .fi { font-size:30px;flex-shrink:0; }
.file-item .fi-info { flex:1; }
.file-item .fi-name { font-weight:700;font-size:15px; }
.file-item .fi-meta { font-size:12px;color:var(--muted);margin-top:3px; }
.file-item .fi-btn {
  background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.3);
  color:#f59e0b; border-radius:8px; padding:7px 16px;
  font-size:12px; font-family:'Cairo',sans-serif; font-weight:700;
  cursor:pointer; transition:all .2s; white-space:nowrap;
}
.file-item .fi-btn:hover { background:rgba(245,158,11,.25); }

/* EMPTY */
.empty { text-align:center;padding:70px 20px;color:var(--muted);animation:fadeIn .5s ease; }
.empty .e-icon { font-size:70px;margin-bottom:16px;opacity:.6; }
.empty h3 { font-size:20px;color:rgba(255,255,255,.5);margin-bottom:8px; }
.empty p  { font-size:14px; }

/* BACK BTN */
.back-btn {
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.55); border-radius:10px; padding:9px 18px;
  font-size:13px; font-family:'Cairo',sans-serif; cursor:pointer;
  transition:all .2s; margin-bottom:24px;
}
.back-btn:hover { background:rgba(255,255,255,.1);color:#fff; }

@keyframes fadeDown { from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none} }
@keyframes fadeUp   { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }
</style>
</head>

  if(!S.grade)   return 0;
  if(!S.semester)return 1;

  if(!S.subject) return 3;
  return 4;

function renderBreadcrumb(){
  const bc=document.getElementById('breadcrumb');
  if(!S.grade){bc.style.display='none';return;}
  bc.style.display='flex';
  const parts=[{label:'🏠 الرئيسية',back:'home'}];

  if(S.semester)parts.push({label:'📅 '+S.semester, back:'semester'});
  if(S.type)    parts.push({label:'📂 '+S.type,      back:'type'});
  if(S.subject) parts.push({label:'📚 '+S.subject,   back:'subject'});
  let h='';
  parts.forEach((p,i)=>{
    const isLast=i===parts.length-1;
    h+=`<span class="crumb ${isLast?'active':''}" ${isLast?'':'onclick="goBack(\''+p.back+'\')"'}>${p.label}</span>`;
    if(!isLast) h+=`<span class="sep">›</span>`;
  });
  bc.innerHTML=h;
}

function goBack(to){
  if(to==='home')    {S={grade:null,semester:null,type:null,subject:null};}

  else if(to==='semester'){S.type=null;S.subject=null;}
  else if(to==='type')    {S.subject=null;}
  render();
}

  if(step===0)renderGrades(c);
  else if(step===1)renderSemesters(c);
  else if(step===2)renderTypes(c);
  else if(step===3)renderSubjects(c);
  else renderFiles(c);
}

function renderGrades(c){
  c.innerHTML=`
    <div class="section-title">🎓 اختر صفك الدراسي</div>
    <div class="cards-grid two-col">
      <div class="card c-red d1" onclick="pick('grade','الحادي عشر')">
        <span class="card-icon">1️⃣1️⃣</span>
        <h3>الحادي عشر</h3>
        <p>الصف الحادي عشر — جميع الفصول والمواد</p>
        <span class="chip">اختر ←</span>
      </div>
      <div class="card c-orange d2" onclick="pick('grade','الثاني عشر')">
        <span class="card-icon">1️⃣2️⃣</span>
        <h3>الثاني عشر</h3>
        <p>الصف الثاني عشر — جميع الفصول والمواد</p>
        <span class="chip">اختر ←</span>
      </div>
    </div>`;
}

function renderSemesters(c){
  c.innerHTML=`
    <button class="back-btn" onclick="goBack('home')">→ رجوع</button>
    <div class="section-title">📅 اختر الفصل الدراسي</div>
    <div class="cards-grid two-col">
      <div class="card c-blue d1" onclick="pick('semester','الفصل الدراسي الأول')">
        <span class="card-icon">🍂</span>
        <h3>الفصل الأول</h3>
        <p>المواد والملفات الخاصة بالفصل الدراسي الأول</p>
        <span class="chip">اختر ←</span>
      </div>
      <div class="card c-teal d2" onclick="pick('semester','الفصل الدراسي الثاني')">
        <span class="card-icon">🌸</span>
        <h3>الفصل الثاني</h3>
        <p>المواد والملفات الخاصة بالفصل الدراسي الثاني</p>
        <span class="chip">اختر ←</span>
      </div>
    </div>`;
}

function renderTypes(c){
  c.innerHTML=`
    <button class="back-btn" onclick="goBack('grade')">→ رجوع</button>
    <div class="section-title">📂 اختر نوع الملفات</div>
    <div class="cards-grid">
      <div class="card c-red d1" onclick="pick('type','الاختبارات النهائية')">
        <span class="card-icon">📝</span>
        <h3>الاختبارات النهائية</h3>
        <p>اختبارات نهاية الفصل والسنوات السابقة</p>
        <span class="chip">اختر ←</span>
      </div>
      <div class="card c-orange d2" onclick="pick('type','الملخصات')">
        <span class="card-icon">📋</span>
        <h3>الملخصات</h3>
        <p>ملخصات شاملة لجميع المواد الدراسية</p>
        <span class="chip">اختر ←</span>
      </div>
      <div class="card c-purple d3" onclick="pick('type','الملفات المهمة')">
        <span class="card-icon">⭐</span>
        <h3>الملفات المهمة</h3>
        <p>مذكرات ومراجع وفيديوهات مفيدة</p>
        <span class="chip">اختر ←</span>
      </div>
    </div>`;
}

function renderSubjects(c){
  const delays=['d1','d2','d3','d4','d5','d6','d7','d8','d9','d10','d11'];
  const cards=SUBJECTS.map((sub,i)=>`
    <div class="card ${sub.color} ${delays[i]}" onclick="pick('subject','${sub.name}')">
      <span class="card-icon">${sub.icon}</span>
      <h3>${sub.name}</h3>
      <span class="chip">اختر ←</span>
    </div>`).join('');
  c.innerHTML=`
    <button class="back-btn" onclick="goBack('semester')">→ رجوع</button>
    <div class="section-title">📚 اختر المادة الدراسية</div>
    <div class="cards-grid">${cards}</div>`;
}

function renderFiles(c){
  const files=DATA[S.grade]?.[S.semester]?.[S.type]?.[S.subject]||[];
  const sub=SUBJECTS.find(s=>s.name===S.subject);
  const icon=sub?sub.icon:'📚';
  let h=`<button class="back-btn" onclick="goBack('type')">→ رجوع</button>`;
  h+=`<div class="section-title">${icon} ${S.subject} — ${S.type}</div>`;
  if(!files.length){
    h+=`<div class="empty">
      <div class="e-icon">📭</div>
      <h3>لا توجد ملفات بعد</h3>
      <p>سيتم إضافة الملفات قريباً، تابعونا!</p>
    </div>`;
  } else {
    h+=`<div class="files-list">`;
    files.forEach(f=>{
      const ico=f.type==='video'?'🎬':'📄';
      const meta=f.type==='video'?'فيديو تعليمي':'ملف PDF';
      h+=`<a class="file-item" href="${f.url}" target="_blank">
        <span class="fi">${ico}</span>
        <div class="fi-info">
          <div class="fi-name">${f.name}</div>
          <div class="fi-meta">${meta}</div>
        </div>
        <button class="fi-btn">فتح ↗</button>
      </a>`;
    });
    h+=`</div>`;
  }
  c.innerHTML=h;
}

function pick(key,val){S[key]=val;render();}
render();
</script>
</body>
</html>
