<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة المنوفي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030712;
  --bg2: #060d1f;
  --text: #e2e8f0;
  --muted: rgba(226,232,240,0.45);
  --gold: #fbbf24;
  --emerald: #10b981;
  --violet: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-blobs {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
}
.blob {
  position: absolute; border-radius: 50%;
  filter: blur(100px); opacity: 0.12;
  animation: blobFloat 14s ease-in-out infinite alternate;
}
.blob1 { width:600px;height:600px;background:#fbbf24;top:-150px;right:-150px;animation-delay:0s; }
.blob2 { width:500px;height:500px;background:#10b981;bottom:-100px;left:-100px;animation-delay:3s; }
.blob3 { width:400px;height:400px;background:#8b5cf6;top:35%;right:25%;animation-delay:5s; }
.blob4 { width:350px;height:350px;background:#06b6d4;bottom:15%;right:5%;animation-delay:2s; }
@keyframes blobFloat {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(25px,18px) scale(1.08); }
}

.container {
  position: relative; z-index: 1;
  max-width: 960px; margin: 0 auto; padding: 40px 20px 80px;
}

.header { text-align:center; margin-bottom:45px; animation:fadeDown .7s ease; }
.header .badge {
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:50px; padding:6px 18px;
  font-size:13px; color:rgba(255,255,255,0.6);
  margin-bottom:18px; letter-spacing:1px;
}
.header h1 {
  font-size:clamp(34px,7vw,62px); font-weight:900; line-height:1.1;
  background:linear-gradient(135deg,#fff 0%,#fbbf24 40%,#10b981 80%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:10px;
}
.header .subtitle {
  color:var(--muted); font-size:15px;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.header .subtitle::before, .header .subtitle::after {
  content:''; display:inline-block; width:40px; height:1px;
  background:linear-gradient(to left,transparent,rgba(255,255,255,0.2));
}
.header .subtitle::after {
  background:linear-gradient(to right,transparent,rgba(255,255,255,0.2));
}

/* LOGO */
.logo-wrap {
  display:flex; align-items:center; justify-content:center;
  margin-bottom:22px; gap:18px;
}
.logo-svg {
  width:80px; height:80px; flex-shrink:0;
  filter: drop-shadow(0 0 18px rgba(245,158,11,0.5));
  animation: logoSpin 6s ease-in-out infinite alternate;
}
@keyframes logoSpin {
  0%   { filter: drop-shadow(0 0 14px rgba(245,158,11,0.4)); transform: rotate(-3deg) scale(1); }
  100% { filter: drop-shadow(0 0 28px rgba(255,107,107,0.6)); transform: rotate(3deg) scale(1.05); }
}

/* BREADCRUMB */
.breadcrumb {
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  margin-bottom:28px; font-size:13px; color:var(--muted);
  animation:fadeIn .4s ease;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px; padding:10px 16px;
}
.breadcrumb .crumb { cursor:pointer;transition:color .2s;display:flex;align-items:center;gap:5px; }
.breadcrumb .crumb:hover { color:#fbbf24; }
.breadcrumb .sep { color:rgba(255,255,255,0.15); }
.breadcrumb .crumb.active { color:#fbbf24;font-weight:700;cursor:default; }

/* SECTION TITLE */
.section-title {
  font-size:17px;font-weight:700;color:rgba(255,255,255,0.6);
  margin-bottom:22px;display:flex;align-items:center;gap:10px;
  animation:fadeIn .4s ease;
}
.section-title::after {
  content:'';flex:1;height:1px;
  background:linear-gradient(to left,transparent,rgba(255,255,255,0.08));
}

/* CARDS */
.cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
.cards-grid.two-col { grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); }

.card {
  position:relative;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:20px; padding:28px 20px 22px;
  cursor:pointer; overflow:hidden; text-align:center;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .3s;
  animation:fadeUp .45s ease both;
}
.card::before {
  content:'';position:absolute;inset:0;
  background:var(--glow,rgba(255,255,255,0.03));
  opacity:0;transition:opacity .3s;
}
.card:hover { transform:translateY(-7px) scale(1.02); border-color:var(--c,rgba(255,255,255,0.2)); box-shadow:0 20px 50px rgba(0,0,0,0.4),0 0 30px var(--shadow,rgba(255,255,255,0.05)); }
.card:hover::before { opacity:1; }
.card .card-icon { font-size:44px;margin-bottom:14px;display:block;transition:transform .3s; }
.card:hover .card-icon { transform:scale(1.2) rotate(-8deg); }
.card h3 { font-size:17px;font-weight:700;color:#fff;margin-bottom:6px; }
.card p  { font-size:12px;color:var(--muted);line-height:1.6; }
.card .chip {
  display:inline-block;margin-top:14px;padding:4px 14px;
  border-radius:50px;font-size:11px;font-weight:700;
  background:var(--chip-bg,rgba(255,255,255,0.07));
  color:var(--chip-c,rgba(255,255,255,0.5));
  border:1px solid var(--chip-border,rgba(255,255,255,0.1));
  transition:all .3s;
}
.card:hover .chip { background:var(--c-alpha,rgba(255,255,255,0.1)); color:var(--c,#fff); border-color:var(--c,rgba(255,255,255,0.3)); }

/* colors */
.c-red   {--c:#f43f5e;--c-alpha:rgba(244,63,94,.15);--shadow:rgba(244,63,94,.2);--glow:rgba(244,63,94,.08)}
.c-orange{--c:#fbbf24;--c-alpha:rgba(251,191,36,.15);--shadow:rgba(251,191,36,.2);--glow:rgba(251,191,36,.08)}
.c-teal  {--c:#10b981;--c-alpha:rgba(16,185,129,.15);--shadow:rgba(16,185,129,.2);--glow:rgba(16,185,129,.08)}
.c-blue  {--c:#38bdf8;--c-alpha:rgba(56,189,248,.15);--shadow:rgba(56,189,248,.2);--glow:rgba(56,189,248,.08)}
.c-purple{--c:#8b5cf6;--c-alpha:rgba(139,92,246,.15);--shadow:rgba(139,92,246,.2);--glow:rgba(139,92,246,.08)}
.c-pink  {--c:#ec4899;--c-alpha:rgba(236,72,153,.15);--shadow:rgba(236,72,153,.2);--glow:rgba(236,72,153,.08)}
.c-green {--c:#22d3ee;--c-alpha:rgba(34,211,238,.15);--shadow:rgba(34,211,238,.2);--glow:rgba(34,211,238,.08)}
.c-sky   {--c:#06b6d4;--c-alpha:rgba(6,182,212,.15); --shadow:rgba(6,182,212,.2); --glow:rgba(6,182,212,.08)}
.c-lime  {--c:#a3e635;--c-alpha:rgba(163,230,53,.15);--shadow:rgba(163,230,53,.2);--glow:rgba(163,230,53,.08)}
.c-rose  {--c:#fb7185;--c-alpha:rgba(251,113,133,.15);--shadow:rgba(251,113,133,.2);--glow:rgba(251,113,133,.08)}
.c-indigo{--c:#818cf8;--c-alpha:rgba(129,140,248,.15);--shadow:rgba(129,140,248,.2);--glow:rgba(129,140,248,.08)}

.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}
.d4{animation-delay:.16s}.d5{animation-delay:.20s}.d6{animation-delay:.24s}
.d7{animation-delay:.28s}.d8{animation-delay:.32s}.d9{animation-delay:.36s}
.d10{animation-delay:.40s}.d11{animation-delay:.44s}

/* FILES */
.files-list { display:flex;flex-direction:column;gap:12px;animation:fadeUp .5s ease; }
.file-item {
  display:flex;align-items:center;gap:15px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:14px; padding:16px 20px;
  text-decoration:none; color:var(--text); transition:all .25s; cursor:pointer;
}
.file-item:hover { border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.05);transform:translateX(-4px); }
.file-item .fi { font-size:30px;flex-shrink:0; }
.file-item .fi-info { flex:1; }
.file-item .fi-name { font-weight:700;font-size:15px; }
.file-item .fi-meta { font-size:12px;color:var(--muted);margin-top:3px; }
.file-item .fi-btn {
  background:rgba(251,191,36,.12); border:1px solid rgba(251,191,36,.3);
  color:#fbbf24; border-radius:8px; padding:7px 16px;
  font-size:12px; font-family:'Cairo',sans-serif; font-weight:700;
  cursor:pointer; transition:all .2s; white-space:nowrap;
}
.file-item .fi-btn:hover { background:rgba(251,191,36,.25); }

/* EMPTY */
.empty { text-align:center;padding:70px 20px;color:var(--muted);animation:fadeIn .5s ease; }
.empty .e-icon { font-size:70px;margin-bottom:16px;opacity:.6; }
.empty h3 { font-size:20px;color:rgba(255,255,255,.5);margin-bottom:8px; }
.empty p  { font-size:14px; }

/* BACK BTN */
.back-btn {
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.55); border-radius:10px; padding:9px 18px;
  font-size:13px; font-family:'Cairo',sans-serif; cursor:pointer;
  transition:all .2s; margin-bottom:24px;
}
.back-btn:hover { background:rgba(255,255,255,.1);color:#fff; }

@keyframes fadeDown { from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none} }
@keyframes fadeUp   { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }

/* ENTRANCE ANIMATION - LUXURY */
#splash {
  position:fixed;inset:0;z-index:9999;
  background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  pointer-events:none;
  overflow:hidden;
}
#splash.hide { animation:splashExit .8s ease forwards; }
@keyframes splashExit { to{opacity:0;transform:scale(1.05)} }

/* Stars background */
.stars { position:absolute;inset:0;overflow:hidden; }
.star { position:absolute;border-radius:50%;background:#fff;animation:twinkle 2s ease-in-out infinite alternate; }
@keyframes twinkle { from{opacity:.1;transform:scale(1)} to{opacity:.9;transform:scale(1.5)} }

/* Gold lines sweep */
.sweep {
  position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 40%, rgba(245,158,11,.15) 50%, transparent 60%);
  animation:sweepMove 2s ease-in-out infinite;
}
@keyframes sweepMove { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

/* Logo circle */
.s-ring {
  width:160px;height:160px;border-radius:50%;
  border:2px solid rgba(251,191,36,.3);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  animation:ringAppear 1s .2s ease both;
  margin-bottom:32px;
}
.s-ring::before {
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(245,158,11,.15);
  animation:ringRotate 4s linear infinite;
}
.s-ring::after {
  content:'';position:absolute;inset:-16px;border-radius:50%;
  border:1px dashed rgba(255,255,255,.08);
  animation:ringRotate 8s linear infinite reverse;
}
@keyframes ringAppear { from{opacity:0;transform:scale(0)} to{opacity:1;transform:scale(1)} }
@keyframes ringRotate { to{transform:rotate(360deg)} }

.s-logo-inner {
  font-size:70px;
  animation:logoPop 1s .4s cubic-bezier(.34,1.56,.64,1) both;
  filter:drop-shadow(0 0 20px rgba(245,158,11,.5));
}
@keyframes logoPop { from{opacity:0;transform:scale(0) rotate(-90deg)} to{opacity:1;transform:scale(1) rotate(0)} }

.s-title {
  font-size:42px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(135deg,#fff 0%,#fbbf24 40%,#10b981 80%,#8b5cf6 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:titleReveal 1s .6s ease both;
  margin-bottom:10px;
}
@keyframes titleReveal { from{opacity:0;letter-spacing:12px;filter:blur(8px)} to{opacity:1;letter-spacing:3px;filter:none} }

.s-sub {
  font-size:13px;color:rgba(255,255,255,.4);letter-spacing:4px;text-transform:uppercase;
  animation:fadeIn .8s 1s ease both;
  margin-bottom:40px;
}

.s-bar-wrap {
  width:200px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;
  overflow:hidden;animation:fadeIn .5s .8s ease both;
}
.s-bar {
  height:100%;background:linear-gradient(90deg,#f59e0b,#ff6b6b,#a855f7);
  border-radius:2px;width:0%;
  animation:barFill 1.8s .9s ease forwards;
}
@keyframes barFill { to{width:100%} }

/* CLICK SOUND + RIPPLE */
.ripple-effect {
  position:fixed;border-radius:50%;
  background:radial-gradient(circle,rgba(251,191,36,.3),transparent);
  pointer-events:none;z-index:9998;
  animation:rippleAnim .6s ease-out forwards;
}
@keyframes rippleAnim { from{width:0;height:0;opacity:1;transform:translate(-50%,-50%)} to{width:120px;height:120px;opacity:0;transform:translate(-50%,-50%)} }


/* AI TEACHER BUTTON - CIRCLE */
.ai-fab {
  position:fixed;bottom:28px;left:28px;z-index:1000;
  background:linear-gradient(135deg,#fbbf24,#10b981);
  border:none;border-radius:50%;
  width:64px;height:64px;
  color:#000;font-size:28px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 32px rgba(251,191,36,.5), 0 0 0 0 rgba(251,191,36,.4);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
  animation:fadeUp .6s 1s ease both, fabPulse 2.5s 2s ease-in-out infinite;
}
.ai-fab:hover{transform:scale(1.15);box-shadow:0 12px 40px rgba(251,191,36,.7)}
@keyframes fabPulse {
  0%,100%{box-shadow:0 8px 32px rgba(251,191,36,.5),0 0 0 0 rgba(251,191,36,.3)}
  50%{box-shadow:0 8px 32px rgba(251,191,36,.5),0 0 0 16px rgba(251,191,36,.0)}
}

/* AI MODAL */
.ai-modal { position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;padding:20px; }
.ai-modal.open{display:flex}
.ai-box { width:100%;max-width:600px;background:linear-gradient(180deg,#0d1117,#030712);border:1px solid rgba(251,191,36,.25);border-radius:24px;padding:24px;animation:fadeUp .4s ease;max-height:80vh;display:flex;flex-direction:column; }
.ai-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ai-header h3{font-size:18px;font-weight:800;flex:1;background:linear-gradient(135deg,#fbbf24,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ai-close{background:rgba(255,255,255,.08);border:none;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
.ai-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;padding:4px;min-height:200px;max-height:350px;}
.ai-msg{padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.7;max-width:85%}
.ai-msg.bot{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2);align-self:flex-start}
.ai-msg.user{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);align-self:flex-end;text-align:right}
.ai-input-row{display:flex;gap:10px}
.ai-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:12px 16px;color:#fff;font-family:'Cairo',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.ai-input:focus{border-color:rgba(251,191,36,.6)}
.ai-send{background:linear-gradient(135deg,#fbbf24,#10b981);border:none;border-radius:12px;padding:12px 18px;color:#000;font-family:'Cairo',sans-serif;font-weight:800;cursor:pointer;transition:transform .2s;white-space:nowrap;}
.ai-send:hover{transform:scale(1.05)}
</style>
</head>
<body>

<!-- SPLASH SCREEN - LUXURY -->
<div id="splash">
  <div class="stars" id="starsContainer"></div>
  <div class="sweep"></div>
  <div class="s-ring">
    <div class="s-logo-inner">📚</div>
  </div>
  <div class="s-title">منصة المنوفي</div>
  <div class="s-sub">منصتك التعليمية المتكاملة</div>
  <div class="s-bar-wrap"><div class="s-bar"></div></div>
</div>

<!-- AI TEACHER BUTTON -->
<button class="ai-fab" onclick="openAI()" title="اسأل المعلم الذكي">🤖</button>

<!-- AI MODAL -->
<div class="ai-modal" id="aiModal" onclick="closeAIOutside(event)">
  <div class="ai-box">
    <div class="ai-header">
      <span style="font-size:24px">🤖</span>
      <h3>المعلم الذكي</h3>
      <button class="ai-close" onclick="closeAI()">✕</button>
    </div>
    <div class="ai-messages" id="aiMessages">
      <div class="ai-msg bot">👋 مرحباً! أنا المعلم الذكي. اسألني عن أي مادة دراسية وسأساعدك! 📖</div>
    </div>
    <div class="ai-input-row">
      <input class="ai-input" id="aiInput" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter')sendAI()"/>
      <button class="ai-send" onclick="sendAI()">إرسال ✈️</button>
    </div>
  </div>
</div>

<div class="bg-blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
</div>

<div class="container">
  <div class="header">
    <!-- LOGO SVG -->
    <div class="logo-wrap">
      <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f59e0b"/>
            <stop offset="100%" style="stop-color:#ff6b6b"/>
          </linearGradient>
          <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4ecdc4"/>
            <stop offset="100%" style="stop-color:#a855f7"/>
          </linearGradient>
        </defs>
        <!-- Outer ring -->
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#g1)" stroke-width="3" stroke-dasharray="8 4" opacity="0.7"/>
        <!-- Book base -->
        <rect x="22" y="30" width="56" height="42" rx="5" fill="url(#g1)" opacity="0.15"/>
        <rect x="22" y="30" width="56" height="42" rx="5" fill="none" stroke="url(#g1)" stroke-width="2"/>
        <!-- Book spine -->
        <line x1="50" y1="30" x2="50" y2="72" stroke="url(#g1)" stroke-width="2"/>
        <!-- Left page lines -->
        <line x1="28" y1="42" x2="46" y2="42" stroke="url(#g1)" stroke-width="1.5" opacity="0.8"/>
        <line x1="28" y1="50" x2="46" y2="50" stroke="url(#g1)" stroke-width="1.5" opacity="0.8"/>
        <line x1="28" y1="58" x2="46" y2="58" stroke="url(#g1)" stroke-width="1.5" opacity="0.8"/>
        <!-- Right page lines -->
        <line x1="54" y1="42" x2="72" y2="42" stroke="url(#g1)" stroke-width="1.5" opacity="0.8"/>
        <line x1="54" y1="50" x2="72" y2="50" stroke="url(#g1)" stroke-width="1.5" opacity="0.8"/>
        <line x1="54" y1="58" x2="72" y2="58" stroke="url(#g1)" stroke-width="1.5" opacity="0.8"/>
        <!-- Star top -->
        <polygon points="50,14 52.5,21 60,21 54,25.5 56.5,33 50,28.5 43.5,33 46,25.5 40,21 47.5,21" fill="url(#g2)" opacity="0.9"/>
      </svg>
    </div>
    <h1>منصة المنوفي</h1>
    <p class="subtitle">منصتك التعليمية المتكاملة</p>
  </div>
  <div class="breadcrumb" id="breadcrumb" style="display:none"></div>
  <div id="mainContent"></div>
</div>

<script>
/* ============================================================
   DATA — أضف ملفاتك هنا بهذا الشكل:
   "اسم المادة": [
     { name: "اسم الملف", url: "https://...", type: "pdf" },
     { name: "اسم الفيديو", url: "https://...", type: "video" },
   ]
   ============================================================ */
const DATA = {
  "الحادي عشر": {
    "الفصل الدراسي الأول": {
      "الاختبارات النهائية": {
        "التربية الإسلامية": [],
        "اللغة العربية": [],

const STEPS = [];

let S = {grade:null,semester:null,type:null,subject:null};

function currentStep(){
  if(!S.grade)   return 0;
  if(!S.semester)return 1;
  if(!S.type)    return 2;
  if(!S.subject) return 3;
  return 4;
}

function renderBreadcrumb(){
  const bc=document.getElementById('breadcrumb');
  if(!S.grade){bc.style.display='none';return;}
  bc.style.display='flex';
  const parts=[{label:'🏠 الرئيسية',back:'home'}];
  if(S.grade)   parts.push({label:'🎓 '+S.grade,   back:'grade'});
  if(S.semester)parts.push({label:'📅 '+S.semester, back:'semester'});
  if(S.type)    parts.push({label:'📂 '+S.type,      back:'type'});
  if(S.subject) parts.push({label:'📚 '+S.subject,   back:'subject'});
  let h='';
  parts.forEach((p,i)=>{
    const isLast=i===parts.length-1;
    h+=`<span class="crumb ${isLast?'active':''}" ${isLast?'':'onclick="goBack(\''+p.back+'\')"'}>${p.label}</span>`;
    if(!isLast) h+=`<span class="sep">›</span>`;
  });
  bc.innerHTML=h;
}

function goBack(to){
  if(to==='home')    {S={grade:null,semester:null,type:null,subject:null};}
  else if(to==='grade')   {S.semester=null;S.type=null;S.subject=null;}
  else if(to==='semester'){S.type=null;S.subject=null;}
  else if(to==='type')    {S.subject=null;}
  render();
}

function render(){
  renderBreadcrumb();
  const c=document.getElementById('mainContent');
  const step=currentStep();
  if(step===0)renderGrades(c);
  else if(step===1)renderSemesters(c);
  else if(step===2)renderTypes(c);
  else if(step===3)renderSubjects(c);
  else renderFiles(c);
}

// CLICK SOUND - Chime
const ctx = new (window.AudioContext||window.webkitAudioContext)();
function playClick(){
  try {
    const frequencies = [523, 659, 784];
    frequencies.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      const reverb = ctx.createGain();
      o.connect(g); g.connect(reverb); reverb.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.06);
      g.gain.setValueAtTime(0, ctx.currentTime + i * 0.06);
      g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + i * 0.06 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.4);
      o.start(ctx.currentTime + i * 0.06);
      o.stop(ctx.currentTime + i * 0.06 + 0.5);
    });
  } catch(e){}
}

document.addEventListener('click',function(e){
  const r=document.createElement('div');
  r.className='ripple-effect';
  r.style.left=e.clientX+'px';
  r.style.top=e.clientY+'px';
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),600);
});

// AI TEACHER
function openAI(){ playClick(); document.getElementById('aiModal').classList.add('open'); document.getElementById('aiInput').focus(); }
function closeAI(){ document.getElementById('aiModal').classList.remove('open'); }
function closeAIOutside(e){ if(e.target===document.getElementById('aiModal')) closeAI(); }

async function sendAI(){
  const input = document.getElementById('aiInput');
  const msg = input.value.trim();
  if(!msg) return;
  playClick();
  input.value = '';
  const msgs = document.getElementById('aiMessages');
  msgs.innerHTML += `<div class="ai-msg user">${msg}</div>`;
  msgs.innerHTML += `<div class="ai-msg bot" id="typing">⏳ جاري التفكير...</div>`;
  msgs.scrollTop = msgs.scrollHeight;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:'أنت معلم ذكي متخصص في المواد الدراسية للمرحلة الثانوية. تجيب بالعربية بأسلوب واضح ومبسط ومشجع. اجعل إجاباتك مختصرة ومفيدة.',
        messages:[{role:'user',content:msg}]
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'عذراً، حدث خطأ. حاول مرة أخرى.';
    document.getElementById('typing').remove();
    msgs.innerHTML += `<div class="ai-msg bot">${reply}</div>`;
  } catch(e) {
    document.getElementById('typing').remove();
    msgs.innerHTML += `<div class="ai-msg bot">عذراً، حدث خطأ في الاتصال. حاول مرة أخرى. 🙏</div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}
